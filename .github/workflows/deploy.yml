name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      # ---------- Deploy ----------
      # Приватный ключ пишем в файл сами, а не отдаём стороннему action.
      # Хост-ключ сервера берём из секрета, а не через ssh-keyscan: keyscan
      # выполняется в момент деплоя и потому уязвим к MITM.
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy static build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      # ---------- Notifications ----------
      # Без parse_mode=HTML: значения из github.* не экранируются, и разметка
      # из имени ветки попала бы прямо в сообщение.
      # continue-on-error: уведомление отправляется уже после деплоя, и его
      # падение не должно красить в красный успешный прогон.
      - name: Notify Telegram — success
        if: ${{ success() && env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=✅ Deploy successful!
          Repository: ${REPO}
          Branch: ${REF_NAME}
          Commit: ${COMMIT_SHA}"

      - name: Notify Telegram — failure
        if: ${{ failure() && env.TELEGRAM_BOT_TOKEN != '' }}
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Deploy failed!
          Repository: ${REPO}
          Branch: ${REF_NAME}
          Commit: ${COMMIT_SHA}"
